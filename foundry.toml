[profile.default]
src = "src"
out = "out"
libs = ["lib"]
optimizer = true
optimizer_runs = 1000000

fs_permissions = [
  { access = "read-write", path = "./" }
]

[fuzz]
runs = 1000

[invariant]
runs = 1000
depth = 500
fail_on_revert = false
call_override = false
dictionary_weight = 80
# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
